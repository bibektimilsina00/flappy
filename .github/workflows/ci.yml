name: CI & Deploy

on:
  push:
    branches: [main]
  pull_request:

env:
  VPS_HOST: 161.118.213.166
  VPS_USER: ubuntu
  VPS_DIR: /opt/riocut

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest apps/api

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: npm i -g pnpm@9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter web typecheck

  build:
    if: github.event_name == 'push'
    needs: [backend, web]
    runs-on: ubuntu-24.04-arm # native ARM runner (free on public repos) — no QEMU
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # only rebuild the image whose sources changed; retag the other so both
      # still exist at :${sha} for the SHA-pinned deploy.
      - uses: dorny/paths-filter@v3
        id: changes
        with:
          filters: |
            backend:
              - 'apps/api/**'
              - 'apps/worker/**'
              - 'pyproject.toml'
              - 'uv.lock'
              - 'deploy/backend.Dockerfile'
            web:
              - 'apps/web/**'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - 'deploy/web.Dockerfile'

      - name: Build & push backend
        if: steps.changes.outputs.backend == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/backend.Dockerfile
          push: true
          platforms: linux/arm64
          tags: |
            ghcr.io/${{ github.repository }}/backend:latest
            ghcr.io/${{ github.repository }}/backend:${{ github.sha }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,scope=backend,mode=max
      - name: Tag backend :${{ github.sha }} (unchanged — copy latest, no rebuild)
        if: steps.changes.outputs.backend != 'true'
        run: |
          docker buildx imagetools create \
            --tag ghcr.io/${{ github.repository }}/backend:${{ github.sha }} \
            ghcr.io/${{ github.repository }}/backend:latest

      - name: Build & push web
        if: steps.changes.outputs.web == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/web.Dockerfile
          push: true
          platforms: linux/arm64
          build-args: |
            NEXT_PUBLIC_API_URL=https://riocut.com
            NEXT_PUBLIC_WS_URL=wss://riocut.com
            API_INTERNAL_URL=http://api:8000
            NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY=${{ secrets.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY }}
            NEXT_PUBLIC_POSTHOG_KEY=${{ secrets.NEXT_PUBLIC_POSTHOG_KEY }}
            NEXT_PUBLIC_POSTHOG_HOST=https://t.riocut.com
          tags: |
            ghcr.io/${{ github.repository }}/web:latest
            ghcr.io/${{ github.repository }}/web:${{ github.sha }}
          cache-from: type=gha,scope=web
          cache-to: type=gha,scope=web,mode=max
      - name: Tag web :${{ github.sha }} (unchanged — copy latest, no rebuild)
        if: steps.changes.outputs.web != 'true'
        run: |
          docker buildx imagetools create \
            --tag ghcr.io/${{ github.repository }}/web:${{ github.sha }} \
            ghcr.io/${{ github.repository }}/web:latest

  deploy:
    if: github.event_name == 'push'
    needs: build
    runs-on: ubuntu-latest
    # never let two deploys race onto the box; queue instead of interleave
    concurrency:
      group: deploy
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - name: Set up SSH
        run: |
          install -m 700 -d ~/.ssh
          echo "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "$VPS_HOST" >> ~/.ssh/known_hosts
      - name: Ship & roll out (health-gated, auto-rollback)
        env:
          ENV_FILE: ${{ secrets.ENV_FILE }}
          CF_ORIGIN_CERT: ${{ secrets.CF_ORIGIN_CERT }}
          CF_ORIGIN_KEY: ${{ secrets.CF_ORIGIN_KEY }}
          CLERK_PUBLISHABLE_KEY: ${{ secrets.CLERK_PUBLISHABLE_KEY }}
          CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}
          CLERK_WEBHOOK_KEY: ${{ secrets.CLERK_WEBHOOK_KEY }}
          POSTHOG_KEY: ${{ secrets.NEXT_PUBLIC_POSTHOG_KEY }}
          SHA: ${{ github.sha }}
        run: |
          # the SHA currently running on the box — rollback target if this deploy is unhealthy
          PREV=$(ssh "$VPS_USER@$VPS_HOST" "grep -E '^IMAGE_TAG=' $VPS_DIR/.env 2>/dev/null | cut -d= -f2" || true)
          scp deploy/docker-compose.prod.yml "$VPS_USER@$VPS_HOST:$VPS_DIR/docker-compose.yml"
          scp deploy/Caddyfile "$VPS_USER@$VPS_HOST:$VPS_DIR/Caddyfile"
          scp deploy/rollout.sh "$VPS_USER@$VPS_HOST:$VPS_DIR/rollout.sh"
          printf '%s\n' "$ENV_FILE" | ssh "$VPS_USER@$VPS_HOST" "install -m 600 /dev/stdin $VPS_DIR/.env"
          # Clerk keys live in their own secrets; append so compose (last-wins) picks them up.
          printf 'CLERK_PUBLISHABLE_KEY=%s\nCLERK_SECRET_KEY=%s\nCLERK_WEBHOOK_KEY=%s\nPOSTHOG_KEY=%s\n' \
            "$CLERK_PUBLISHABLE_KEY" "$CLERK_SECRET_KEY" "$CLERK_WEBHOOK_KEY" "$POSTHOG_KEY" \
            | ssh "$VPS_USER@$VPS_HOST" "cat >> $VPS_DIR/.env"
          ssh "$VPS_USER@$VPS_HOST" "mkdir -p $VPS_DIR/certs"
          printf '%s\n' "$CF_ORIGIN_CERT" | ssh "$VPS_USER@$VPS_HOST" "install -m 644 /dev/stdin $VPS_DIR/certs/origin.pem"
          printf '%s\n' "$CF_ORIGIN_KEY" | ssh "$VPS_USER@$VPS_HOST" "install -m 600 /dev/stdin $VPS_DIR/certs/origin.key"
          ssh "$VPS_USER@$VPS_HOST" "
            set -e
            cd $VPS_DIR
            echo '${{ secrets.GITHUB_TOKEN }}' | docker login ghcr.io -u '${{ github.actor }}' --password-stdin
            bash rollout.sh '$SHA' '$PREV'
          "

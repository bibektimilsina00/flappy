name: CI & Deploy

on:
  push:
    branches: [main]
  pull_request:

env:
  VPS_HOST: 161.118.213.166
  VPS_USER: ubuntu
  VPS_DIR: /opt/riocut

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest apps/api

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: npm i -g pnpm@9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter web typecheck

  build:
    if: github.event_name == 'push'
    needs: [backend, web]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build & push backend
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/backend.Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ghcr.io/${{ github.repository }}/backend:latest
            ghcr.io/${{ github.repository }}/backend:${{ github.sha }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,scope=backend,mode=max
      - name: Build & push web
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/web.Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          build-args: |
            NEXT_PUBLIC_API_URL=https://riocut.com
            NEXT_PUBLIC_WS_URL=wss://riocut.com
            API_INTERNAL_URL=http://api:8000
          tags: |
            ghcr.io/${{ github.repository }}/web:latest
            ghcr.io/${{ github.repository }}/web:${{ github.sha }}
          cache-from: type=gha,scope=web
          cache-to: type=gha,scope=web,mode=max

  deploy:
    if: github.event_name == 'push'
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up SSH
        run: |
          install -m 700 -d ~/.ssh
          echo "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "$VPS_HOST" >> ~/.ssh/known_hosts
      - name: Ship compose file & roll over
        env:
          ENV_FILE: ${{ secrets.ENV_FILE }}
        run: |
          scp deploy/docker-compose.prod.yml "$VPS_USER@$VPS_HOST:$VPS_DIR/docker-compose.yml"
          scp deploy/Caddyfile "$VPS_USER@$VPS_HOST:$VPS_DIR/Caddyfile"
          printf '%s\n' "$ENV_FILE" | ssh "$VPS_USER@$VPS_HOST" "install -m 600 /dev/stdin $VPS_DIR/.env"
          ssh "$VPS_USER@$VPS_HOST" "
            set -e
            cd $VPS_DIR
            echo '${{ secrets.GITHUB_TOKEN }}' | docker login ghcr.io -u '${{ github.actor }}' --password-stdin
            docker compose pull -q
            docker compose up -d --remove-orphans
            docker compose exec caddy caddy reload --config /etc/caddy/Caddyfile || docker compose restart caddy
            docker image prune -f
          "

name: riocut

x-logging: &logging
  logging:
    driver: json-file
    options: { max-size: "10m", max-file: "3" }

x-backend: &backend
  image: ghcr.io/bibektimilsina00/riocut/backend:latest
  restart: unless-stopped
  env_file: .env
  <<: *logging
  depends_on:
    postgres: { condition: service_healthy }
    redis: { condition: service_healthy }
    minio: { condition: service_healthy }

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: video
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d video"]
      interval: 5s
      retries: 10
    <<: *logging

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 10
    <<: *logging

  minio:
    # ponytail: unpinned latest — pin a RELEASE tag if a pull ever breaks prod
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:?}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:?}
    # Public: presigned URLs the browser loads point here.
    ports: ["9000:9000"]
    volumes: ["miniodata:/data"]
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      retries: 10
    <<: *logging

  api:
    <<: *backend
    command: sh -c "alembic -c apps/api/alembic.ini upgrade head && exec uvicorn apps.api.app.main:app --host 0.0.0.0 --port 8000"
    # Public: OAuth redirects and WebSockets hit the API directly.
    ports: ["8000:8000"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      retries: 3

  worker:
    <<: *backend
# ponytail: concurrency=1 — the VPS is 1 vCPU/2GB; raise when the box grows
    command: celery -A apps.worker.app.worker worker --loglevel=info --concurrency=1
    # Whisper models download once, then persist here.
    volumes: ["modelcache:/home/app/.cache"]

  beat:
    <<: *backend
    command: celery -A apps.api.app.core.celery beat --loglevel=info --schedule=/tmp/celerybeat-schedule

  web:
    image: ghcr.io/bibektimilsina00/riocut/web:latest
    restart: unless-stopped
    ports: ["80:3000"]
    depends_on: [api]
    <<: *logging

volumes:
  pgdata:
  miniodata:
  modelcache:

name: riocut

x-logging: &logging
  logging:
    driver: json-file
    options: { max-size: "10m", max-file: "3" }

x-backend: &backend
  image: ghcr.io/bibektimilsina00/riocut/backend:${IMAGE_TAG:-latest}
  restart: unless-stopped
  env_file: .env
  <<: *logging
  depends_on:
    postgres: { condition: service_healthy }
    redis: { condition: service_healthy }

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: video
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d video"]
      interval: 5s
      retries: 10
    <<: *logging

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 10
    <<: *logging

  api:
    <<: *backend
    # migrations run once up-front in rollout.sh (not here), so the api starts
    # fast on every restart instead of waiting on `alembic upgrade head`.
    command: uvicorn apps.api.app.main:app --host 0.0.0.0 --port 8000
    # rw: yt-dlp persists YouTube's rotated cookies back into the file.
    volumes: ["./ytdlp:/ytdlp"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      retries: 3

  worker:
    <<: *backend
# ponytail: concurrency=2 on the 2-core/12GB A1. It co-hosts web+api, so 2 keeps
# some render throughput without starving them; drop to 1 if web latency spikes.
    command: celery -A apps.worker.app.worker worker --loglevel=info --concurrency=2
    volumes: ["./ytdlp:/ytdlp"]

  beat:
    <<: *backend
    command: celery -A apps.api.app.core.celery beat --loglevel=info --schedule=/tmp/celerybeat-schedule

  # Generates YouTube PO tokens for yt-dlp (bot-wall bypass on datacenter IPs).
  # Version should track the bgutil-ytdlp-pot-provider python package.
  pot:
    image: brainicism/bgutil-ytdlp-pot-provider:1.3.1
    restart: unless-stopped
    <<: *logging

  web:
    image: ghcr.io/bibektimilsina00/riocut/web:${IMAGE_TAG:-latest}
    restart: unless-stopped
    depends_on: [api]
    <<: *logging

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    # The only public service. /api -> api, /video-assets -> minio, rest -> web.
    # 443/udp = HTTP/3.
    ports: ["80:80", "443:443", "443:443/udp"]
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./certs:/etc/caddy/certs:ro
      - caddydata:/data
    depends_on: [web]
    <<: *logging

volumes:
  pgdata:
  caddydata:

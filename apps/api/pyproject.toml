[project]
name = "video-api"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlmodel>=0.0.22",
    "psycopg[binary]>=3.2",
    "alembic>=1.13",
    "pydantic-settings>=2.4",
    "redis>=5.0",
    "celery>=5.4",
    "python-jose[cryptography]>=3.3",
    "argon2-cffi>=23.1",
    "python-multipart>=0.0.9",
    "boto3>=1.35",
    "pillow>=10.4",
    "httpx>=0.27",
    "imageio-ffmpeg>=0.6.0",
]

[tool.uv]
package = false

# Repo root is the import root — everything is addressed as apps.api.app.*
# Launched as: uvicorn apps.api.app.main:app  (from repo root)
[tool.ruff]
src = ["../.."]

[tool.pytest.ini_options]
pythonpath = ["../.."]

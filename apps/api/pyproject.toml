[project]
name = "video-api"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlmodel>=0.0.22",
    "psycopg[binary]>=3.2",
    "alembic>=1.13",
    "pydantic-settings>=2.4",
    "redis>=5.0",
    "celery>=5.4",
    "python-jose[cryptography]>=3.3",
    "argon2-cffi>=23.1",
    "python-multipart>=0.0.9",
    "boto3>=1.35",
    "pillow>=10.4",
    "httpx>=0.27",
    "imageio-ffmpeg>=0.6.0",
    "yt-dlp>=2026.7.4",
    # yt-dlp's YouTube challenge solver scripts (run via deno, baked into the
    # backend image) — without them extraction hits the bot wall.
    "yt-dlp-ejs>=0.8",
    # PO-token plugin — YouTube bot-walls datacenter IPs without it (needs the
    # bgutil provider service; see CLIPS_POT_PROVIDER_URL).
    "bgutil-ytdlp-pot-provider>=1.3",
    "opencv-python-headless>=5.0.0.93",
]

[dependency-groups]
dev = ["ruff>=0.8", "pytest>=8"]

[tool.uv]
package = false

# Repo root is the import root — everything is addressed as apps.api.app.*
# Launched as: uvicorn apps.api.app.main:app  (from repo root)
[tool.ruff]
extend = "../../pyproject.toml"
src = ["../.."]

[tool.pytest.ini_options]
pythonpath = ["../.."]
